name: Sync public catalogues
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['site/index.html']
  schedule:
    - cron: '7,22,37,52 * * * *'
permissions:
  contents: read
concurrency:
  group: pima-catalogue-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore processed public pages
        uses: actions/cache/restore@v4
        with:
          path: .cache
          key: pima-pages-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: pima-pages-
      - run: pip install -r requirements.txt
      - name: Prepare all catalogues
        id: prepare
        env:
          DRIVE_API_KEY: ${{ secrets.DRIVE_API_KEY }}
        run: python scripts/sync.py
      - name: Publish catalogue to Cloudflare Pages
        id: publish
        if: steps.prepare.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages deploy dist --project-name=pima-catalogue --branch=main
      - name: Mark published content
        if: steps.publish.outcome == 'success'
        run: cp .cache/candidate.sha .cache/published.sha
      - uses: actions/cache/save@v4
        with:
          path: .cache
          key: pima-pages-${{ github.run_id }}-${{ github.run_attempt }}
